[bumpversion]
# Single source of truth: the VERSION file (one line).
# Bump types:
#   patch | minor | major  -> release versions, auto-commit + auto-tag
#   dev                   -> development version (X.Y.Z-dev.N), auto-commit, no tag
# Never edit VERSION by hand: bump2version owns it.
# When starting a new package, set current_version to your actual starting version
# (e.g. "0.1.0", or "0.1.0-dev.0" if you want to start in dev mode).
current_version = 0.1.0
commit = True
tag = True
message = Bump version: {current_version} → {new_version}
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(-dev\.(?P<dev>\d+))?
serialize = 
	{major}.{minor}.{patch}-dev.{dev}
	{major}.{minor}.{patch}

[bumpversion:file:VERSION]